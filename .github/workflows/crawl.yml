name: Continuous crawl

on:
  schedule:
    # Hourly (GitHub may delay cron slightly under load)
    - cron: "5 * * * *"
  workflow_dispatch:

# GITHUB_TOKEN pushes do not trigger other workflows, so this job must
# deploy Pages itself after writing feed.json.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: demand-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run crawl
      - name: Commit feed if changed
        run: |
          git config user.name "pellet-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/feed.json
          if git diff --staged --quiet; then
            echo "No feed changes"
          else
            git commit -m "chore: refresh pellet demand feed"
            git push
          fi
      - run: npm run build
        env:
          VITE_BASE: /pellet-demand-radar/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
